name: CI
on:
  push:
  pull_request:

jobs:
  pure-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: ruff check .
      - run: python -m pytest -q

  fem:
    runs-on: ubuntu-latest
    env:
      # MPICH/libfabric on GitHub runners can abort silently (exit code 16) in the first MUMPS solve;
      # the TCP provider and single-thread BLAS avoid it (same settings as the local runs).
      FI_PROVIDER: tcp
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          channels: conda-forge
          channel-priority: strict
          python-version: "3.12"
          activate-environment: adaptdg
      - run: conda install -y fenics-dolfinx=0.11 pytest ruff
      - run: pip install -e .
      - run: ruff check .
      - run: python -X faulthandler -m pytest -v
